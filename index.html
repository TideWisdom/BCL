<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基礎中國語文科自習系統</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--primary-color);
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            background-color: #fff;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>基礎中國語文科自習系統</h2>
        
        <form id="studyForm" onsubmit="navigateToUnit(event)">
            <div class="form-group">
                <label for="gradeSelect">選擇年級：</label>
                <select id="gradeSelect" required>
                    <option value="" disabled selected>-- 請選擇年級 --</option>
                    <option value="f4">中四級</option>
                    <option value="f5">中五級</option>
                </select>
            </div>

            <div class="form-group">
                <label for="unitSelect">選擇單元：</label>
                <select id="unitSelect" required>
                    <option value="" disabled selected>-- 請先選擇年級或單元 --</option>
                    <option value="01">單元一</option>
                    <option value="02">單元二</option>
                    <option value="03">單元三</option>
                    <option value="04">單元四</option>
                    <option value="05">單元五</option>
                    <option value="06">單元六</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">進入自習</button>
        </form>
    </div>

    <script>
        function navigateToUnit(event) {
            // 阻止表單預設提交行為
            event.preventDefault();

            const grade = document.getElementById('gradeSelect').value;
            const unit = document.getElementById('unitSelect').value;

            if (!grade || !unit) {
                alert('請完整選擇年級與單元！');
                return;
            }

            // 根據規則組合檔名：
            // 中四級 (f4) + 單元一 (01) -> BCLf401.html
            // 中五級 (f5) + 單元一 (01) -> BCLf501.html
            const fileName = `BCL${grade}${unit}.html`;

            // 導向對應的頁面
            window.location.href = fileName;
        }
    </script>

</body>
</html>
